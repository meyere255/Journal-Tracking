        .wrap{
          --paper:#EDF0F3; --card:#fff; --ink:#16202B; --rule:#C9D2DB;
          --muted:#6E7C8C; --blue:#1D4E89; --green:#0E7C5A; --ox:#8C2F1D;
          --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
          --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
          background:var(--paper); color:var(--ink); font-family:var(--sans);
          min-height:100vh; padding:20px 16px 48px;
        }
        .wrap *{box-sizing:border-box}
        .shell{max-width:760px;margin:0 auto}

        .masthead{display:flex;justify-content:space-between;align-items:baseline;
          border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:2px}
        .title{font-family:var(--mono);font-size:13px;font-weight:700;
          letter-spacing:.22em;text-transform:uppercase}
        .pl{font-family:var(--mono);font-size:26px;font-weight:700;
          font-variant-numeric:tabular-nums;line-height:1}
        .plsub{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
          color:var(--muted);text-align:right;margin-top:3px}

        .tape{display:flex;gap:2px;margin:14px 0 6px}
        .tick{flex:1;height:34px;background:var(--card);border:1px solid var(--rule);
          position:relative;overflow:hidden;cursor:pointer;padding:0}
        .tick:hover{border-color:var(--blue)}
        .tick.sel{border:2px solid var(--ink)}
        .fill{position:absolute;left:0;right:0;bottom:0;background:var(--green);opacity:.85}
        .tickd{position:absolute;top:3px;left:0;right:0;font-family:var(--mono);
          font-size:9px;letter-spacing:.06em;color:var(--muted);text-align:center}
        .tapelbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;
          color:var(--muted);margin-bottom:16px}

        .nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
        .arrow{font-family:var(--mono);font-size:15px;background:var(--card);
          border:1px solid var(--rule);width:32px;height:32px;cursor:pointer;color:var(--ink)}
        .arrow:hover{background:var(--ink);color:var(--card)}
        .datel{font-family:var(--mono);font-size:12px;letter-spacing:.16em;font-weight:700}
        .daytag{font-size:11.5px;color:var(--muted);font-style:italic}

        .tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:0;
          align-items:stretch;overflow-x:auto;overflow-y:hidden;
          scrollbar-width:thin;-webkit-overflow-scrolling:touch}
        .tabs::-webkit-scrollbar{height:3px}
        .tabs::-webkit-scrollbar-thumb{background:var(--rule)}
        .tsep{width:1px;background:var(--rule);margin:7px 6px;flex-shrink:0}
        .tab{font-family:var(--mono);font-size:10px;letter-spacing:.13em;white-space:nowrap;
          text-transform:uppercase;padding:9px 11px;background:transparent;border:none;
          border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);flex-shrink:0}
        .tab:hover{color:var(--ink)}
        .tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
        .tabx{margin-left:6px;opacity:.4}
        .tabx:hover{opacity:1;color:var(--ox)}
        .addwrap{display:flex;gap:0;padding:7px 0 8px;margin-bottom:0}
        .addin{font-family:var(--mono);font-size:10px;padding:5px 8px;width:110px;
          border:1px solid var(--rule);background:var(--card);color:var(--ink)}
        .addbtn{font-family:var(--mono);font-size:10px;padding:5px 10px;cursor:pointer;
          border:1px solid var(--ink);border-left:none;background:var(--ink);color:var(--card)}

        .panel{background:var(--card);border:1px solid var(--rule)}

        .row{display:flex;align-items:center;gap:12px;padding:0 14px;height:38px;
          border-bottom:1px solid #E8EDF1;cursor:pointer;position:relative}
        .row:last-child{border-bottom:none}
        .row:hover{background:#F7F9FB}
        .row.on .txt{color:var(--muted);text-decoration:line-through}
        .tm{font-family:var(--mono);font-size:10.5px;color:var(--muted);
          font-variant-numeric:tabular-nums;width:42px;flex-shrink:0}
        .bx{width:15px;height:15px;border:1.5px solid var(--rule);flex-shrink:0;
          display:flex;align-items:center;justify-content:center}
        .row.on .bx{background:var(--green);border-color:var(--green)}
        .bx svg{display:block}
